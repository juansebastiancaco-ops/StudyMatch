services:
  mysql:
    image: mysql:8.4
    container_name: studymatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studymatch
      MYSQL_USER: studymatch
      MYSQL_PASSWORD: studymatch
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - studymatch_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  studymatch_mysql_data:
