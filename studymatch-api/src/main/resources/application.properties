# =====================================================================
# StudyMatch API - configuracion de ejecucion
# Las credenciales y secretos se inyectan por variables de entorno.
# Los valores por defecto solo sirven para el entorno local de desarrollo.
# =====================================================================

quarkus.http.port=${PORT:8080}
quarkus.http.root-path=/
quarkus.application.name=studymatch-api
quarkus.banner.enabled=false

# ---------------------------------------------------------------------
# Datasource MySQL (docker-compose.yml levanta studymatch/studymatch)
# ---------------------------------------------------------------------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:studymatch}
quarkus.datasource.password=${DB_PASSWORD:studymatch}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/studymatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20

# En desarrollo Hibernate puede ajustar el esquema; en produccion se usa
# el esquema SQL versionado de sql/schema.sql (generation=none).
quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------
# CORS para los clientes web (por defecto cualquier origen en desarrollo)
# ---------------------------------------------------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location

# ---------------------------------------------------------------------
# Seguridad JWT HS256
# ---------------------------------------------------------------------
studymatch.security.jwt.secret=${JWT_SECRET:studymatch-dev-secret-change-in-production-please}
studymatch.security.jwt.issuer=${JWT_ISSUER:studymatch}
studymatch.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}

# ---------------------------------------------------------------------
# Pesos de la estrategia compuesta de recomendacion (deben sumar 1.0)
# ---------------------------------------------------------------------
studymatch.recommendation.weights.subject=${WEIGHT_SUBJECT:0.35}
studymatch.recommendation.weights.schedule=${WEIGHT_SCHEDULE:0.30}
studymatch.recommendation.weights.career=${WEIGHT_CAREER:0.20}
studymatch.recommendation.weights.academic=${WEIGHT_ACADEMIC:0.15}

# ---------------------------------------------------------------------
# Workers en segundo plano (virtual threads)
# ---------------------------------------------------------------------
studymatch.workers.affinity.seconds=${WORKER_AFFINITY_SECONDS:60}
studymatch.workers.recommendations.seconds=${WORKER_RECOMMENDATIONS_SECONDS:90}
